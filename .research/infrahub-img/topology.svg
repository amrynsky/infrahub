.t-edge{font:11px "IBM Plex Mono",Menlo,Consolas,monospace; fill:#566775}
.t-head{font:600 12px "IBM Plex Mono",Menlo,Consolas,monospace; fill:#0d7a7e; letter-spacing:.04em}
.t-tag{font:600 11px "IBM Plex Mono",Menlo,Consolas,monospace; fill:#0d7a7e}
.tag-bg{fill:#ffffff; stroke:#0d7a7e; stroke-width:1.2}
.lbl-bg{fill:#ffffff}
